name: Test Kernel Build For Pipa

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Record build start time
        id: build_start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set branch environment variable
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install nano vim wget curl git ccache \
          automake flex lzop bison gperf build-essential zip \
          curl zlib1g-dev g++-multilib libxml2-utils bzip2 \
          libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools \
          pngcrush schedtool dpkg-dev liblz4-tool make optipng \
          maven libssl-dev pwgen libswitch-perl policycoreutils \
          minicom libxml-sax-base-perl libxml-simple-perl bc \
          libc6-dev-i386 lib32ncurses-dev libx11-dev lib32z-dev \
          libgl1-mesa-dev xsltproc unzip device-tree-compiler \
          cpio p7zip p7zip-full libtinfo6 -y

          sudo apt install python3 python-is-python3 -y

      - name: Install AOSP-Clang
        run: |
          mkdir -p ${{ github.workspace }}/clang
          wget -c --tries=10 --waitretry=5 --retry-on-host-error --retry-connrefused -O clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r547379.tar.gz"
          tar -xzf clang.tar.gz -C ${{ github.workspace }}/clang
          echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH

      - name: Grant execute permission for build.sh
        run: chmod +x build.sh

      - name: Build Kernel (Test)
        env:
          BUILD_TARGET: ${{ github.event.inputs.target || 'aosp' }}
        run: ./build.sh "${BUILD_TARGET}"

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v7
        with:
          name: Kernel-Pipa-Test-${{ github.ref_name }}-${{ github.run_number }}
          path: '*.zip'
          if-no-files-found: error

      - name: Upload Error Log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-error-log-${{ github.ref_name }}
          path: error.log

      - name: Send Telegram notification
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          END=$(date +%s)
          START="${{ steps.build_start.outputs.start }}"
          DURATION=$((END - ${START:-END}))
          HOURS=$((DURATION / 3600))
          MINS=$(((DURATION % 3600) / 60))
          SECS=$((DURATION % 60))
          DURATION_FMT=$(printf "%02d:%02d:%02d" $HOURS $MINS $SECS)

          REPO="${{ github.repository }}"
          REPO_URL="https://github.com/${REPO}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${COMMIT_SHA}"
          BRANCH="${{ github.ref_name }}"
          RUN_NUMBER="${{ github.run_number }}"
          ACTOR="${{ github.actor }}"

          COMMIT_MSG=$(git log -1 --pretty=format:'%s' "${COMMIT_SHA}" 2>/dev/null | head -c 120)
          [ -z "$COMMIT_MSG" ] && COMMIT_MSG="(no message)"

          if [ "${{ job.status }}" == "success" ]; then
            STATUS="🟢 Build Success"
          else
            STATUS="🔴 Build Failed"
          fi

          printf -v MESSAGE '%s\nRepository: <a href="%s">%s</a>\nBranch: %s\nDuration: %s\nActions: <a href="%s">#%s</a>\nCommit: <a href="%s">%s</a> %s\nCommitter: %s' \
            "$STATUS" "$REPO_URL" "$REPO" "$BRANCH" "$DURATION_FMT" "$RUN_URL" "$RUN_NUMBER" "$COMMIT_URL" "$SHORT_SHA" "$COMMIT_MSG" "$ACTOR"

          if [ "${{ job.status }}" == "success" ]; then
            ZIP_FILE=$(ls *.zip 2>/dev/null | head -1)
            if [ -n "$ZIP_FILE" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F parse_mode=HTML \
                -F caption="${MESSAGE}" \
                -F "document=@${ZIP_FILE}"
            else
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode parse_mode=HTML \
                --data-urlencode text="${MESSAGE}"
            fi
          else
            if [ -f error.log ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F parse_mode=HTML \
                -F caption="${MESSAGE}" \
                -F "document=@error.log"
            else
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode parse_mode=HTML \
                --data-urlencode text="${MESSAGE}"
            fi
          fi
